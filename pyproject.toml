[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pasr-mcp"
version = "0.2.1"
description = "Provenance-aware span recall: a zero-setup context-broker MCP for coding and document agents."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Apheironn" }]
keywords = [
  "mcp", "model-context-protocol", "mcp-server", "llm", "ai-agent", "coding-agent",
  "context", "context-engineering", "retrieval", "rag", "code-search", "repo-map",
  "token-budget", "provenance", "claude", "cursor", "tree-sitter",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Environment :: Console",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Documentation",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "tiktoken>=0.7",
  "pathspec>=0.12",
  "mcp>=2,<3",
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-rust>=0.23",
]

[project.scripts]
pasr = "pasr.cli:main"
pasr-mcp = "pasr.mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6", "pyyaml>=6"]
semantic = ["sentence-transformers>=3,<6"]
# the evaluation harness is its own distribution: `pip install ./eval` (package
# `pasr-bench`); this extra keeps the deps for running it from the source tree.
eval = ["anthropic>=0.40", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/Apheironn/pasr"
Source = "https://github.com/Apheironn/pasr"

[tool.hatch.build.targets.wheel]
packages = ["src/pasr"]

[tool.hatch.build.targets.sdist]
# the library sdist: package source + tests + project metadata only.
# the evaluation harness (eval/) is its own distribution, pasr-bench.
include = [
  "src/pasr",
  "tests",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "CODE_OF_CONDUCT.md",
  "CITATION.cff",
  "server.json",
]
# these two exercise paths that live outside the library sdist (eval/, .github/)
exclude = ["tests/test_eval_harness.py", "tests/test_ci_assets.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src", "eval"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
