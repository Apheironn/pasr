[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pasr-bench"
version = "0.2.1"
description = "PASR-Bench: a pre-registered protocol for measuring a code-context retriever against grep, a repo-map, semantic search, and a whole-repo dump."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Apheironn" }]
keywords = ["benchmark", "retrieval", "context", "coding-agent", "evaluation", "non-inferiority"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pasr-mcp>=0.2",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]      # the real answer + judge agent
plots = ["matplotlib>=3.7"]    # report.png
dev = ["pytest>=8,<9", "ruff>=0.6"]

[project.scripts]
pasr-bench = "pasr_eval.__main__:main"

[project.urls]
Homepage = "https://github.com/Apheironn/pasr"
Source = "https://github.com/Apheironn/pasr/tree/main/eval"

[tool.hatch.build.targets.wheel]
packages = ["pasr_eval"]
artifacts = ["pasr_eval/plans/*.json"]

[tool.hatch.build.targets.wheel.force-include]
"RESULTS.md" = "pasr_eval/RESULTS.md"

[tool.hatch.build.targets.sdist]
include = ["pasr_eval", "README.md", "RESULTS.md"]
