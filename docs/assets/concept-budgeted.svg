<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <defs>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#11151f"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#2b333f" stroke-width="2"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="818" height="170" rx="10" fill="#0b0e14" stroke="#232a36"/>

  <text x="24" y="34" font-size="13" fill="#8b949e">budget <tspan fill="#c9d1d9">3,000</tspan> tokens — a hard ceiling</text>

  <!-- bar -->
  <rect x="24" y="48" width="772" height="26" rx="5" fill="url(#hatch)" stroke="#2b333f"/>
  <rect x="24" y="48" width="699" height="26" rx="5" fill="#1f6f3f"/>
  <rect x="24" y="48" width="699" height="26" rx="5" fill="#3fb950" opacity="0.28"/>
  <line x1="723" y1="44" x2="723" y2="78" stroke="#3fb950" stroke-width="2"/>
  <text x="34" y="66" font-size="12.5" fill="#e6edf3">kept 2,718</text>
  <text x="786" y="66" font-size="12.5" fill="#6e7681" text-anchor="end">282 free</text>

  <text x="24" y="104" font-size="12.5" fill="#6e7681">PASR never returns more than the budget. Spans are whole — never a truncated function.</text>
  <text x="24" y="126" font-size="12.5" fill="#6e7681">Does the entire file set already fit? You get it back <tspan fill="#7ee787">unchanged</tspan>, and PASR says so.</text>
  <text x="24" y="152" font-size="12" fill="#484f58">select_context(query, budget_tokens=3000)  ·  same input → identical bytes out</text>
</svg>
