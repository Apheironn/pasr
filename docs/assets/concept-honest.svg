<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <rect x="1" y="1" width="818" height="226" rx="10" fill="#0b0e14" stroke="#232a36"/>

  <text x="24" y="32" font-size="13" fill="#8b949e">every result is classified — PASR tells the agent when it is the wrong tool</text>

  <!-- row 1: aggregation -->
  <text x="24" y="70" font-size="13.5" fill="#c9d1d9">"list every place a request is retried"</text>
  <rect x="470" y="55" width="104" height="22" rx="11" fill="#3a2a12" stroke="#d29922"/>
  <text x="522" y="70" font-size="12" fill="#d29922" text-anchor="middle">aggregation</text>
  <text x="40" y="94" font-size="12.5" fill="#6e7681">→ read the files directly; a budgeted slice would only sample the answer</text>

  <line x1="24" y1="112" x2="796" y2="112" stroke="#1c2330"/>

  <!-- row 2: localized -->
  <text x="24" y="146" font-size="13.5" fill="#c9d1d9">"how are redirects resolved and followed"</text>
  <rect x="470" y="131" width="104" height="22" rx="11" fill="#12331d" stroke="#3fb950"/>
  <text x="522" y="146" font-size="12" fill="#7ee787" text-anchor="middle">localized</text>
  <text x="40" y="170" font-size="12.5" fill="#6e7681">→ confidence 0.68 · "looks complete for a localized question"</text>

  <line x1="24" y1="188" x2="796" y2="188" stroke="#1c2330"/>

  <text x="24" y="212" font-size="12.5" fill="#6e7681">Low coverage instead? The advice says so: <tspan fill="#484f58">"also grep for X, or call expand_context"</tspan>.</text>
</svg>
