  <text x="44" y="270" font-size="12.5" fill="#8b949e">  3  <tspan fill="#a5d6ff">src/requests/sessions.py:117-159</tspan>   400 tok   <tspan fill="#d2a8ff">bm25, lexical_anchor</tspan></text>
