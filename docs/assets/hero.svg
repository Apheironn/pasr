  <text x="44" y="326" font-size="12.5" fill="#8b949e">## Dropped (4): 2 over budget, 2 overlapping — with ranks, in the receipt</text>

  <text x="44" y="398" font-size="14" fill="#c9d1d9">One tool call. <tspan fill="#7ee787">~90% fewer tokens.</tspan> A receipt for every line.</text>
  <text x="44" y="428" font-size="12.5" fill="#8b949e">50 tasks / 10 repos: PASR <tspan fill="#c9d1d9">0.48</tspan> task success @ 5.8k ctx vs a 59k whole-repo dump's <tspan fill="#c9d1d9">0.38</tspan></text>
  <text x="44" y="450" font-size="12.5" fill="#8b949e">critical file in context <tspan fill="#c9d1d9">46/50</tspan> vs the dump's <tspan fill="#c9d1d9">33/50</tspan>  ·  bounded efficiency result, not a superiority claim</text>
