  <text x="450" y="50" text-anchor="middle" fill="#7d8590" font-size="12">pasr — provenance-aware span recall</text>

  <text x="44" y="92" font-size="13.5" fill="#c9d1d9"><tspan fill="#7ee787">$</tspan> pasr explain <tspan fill="#a5d6ff">"how are redirects resolved and followed"</tspan> src</text>

  <text x="44" y="126" font-size="13" fill="#8b949e"># Selection receipt <tspan fill="#c9d1d9">0407e3bc74a5</tspan></text>
  <text x="44" y="150" font-size="13" fill="#8b949e">- Route: <tspan fill="#7ee787">selected</tspan>  |  <tspan fill="#c9d1d9">2 718 / 3 000</tspan> tokens  |  42 768 input  |  <tspan fill="#7ee787">94% reduction</tspan></text>
  <text x="44" y="174" font-size="13" fill="#8b949e">- Assessment: <tspan fill="#c9d1d9">localized</tspan>, confidence <tspan fill="#c9d1d9">0.68</tspan> — looks complete</text>

  <text x="44" y="208" font-size="13" fill="#8b949e">## Kept (10 spans)</text>
