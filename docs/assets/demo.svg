<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- window -->
  <rect x="10" y="10" width="840" height="410" rx="12" fill="#0b0e14" stroke="#232a36" stroke-width="1" filter="url(#shadow)"/>
  <rect x="10" y="10" width="840" height="40" rx="12" fill="#11151f"/>
  <rect x="10" y="38" width="840" height="12" fill="#11151f"/>
  <circle cx="34" cy="30" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="30" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="30" r="6" fill="#27c93f"/>
  <text x="430" y="34" text-anchor="middle" font-size="12.5" fill="#5b6472">pasr explain</text>

  <!-- Static transcript: readable without animation support or waiting. -->
  <text x="26" y="80" font-size="14" fill="#7ee787">$</text>
  <g>
    <text x="42" y="80" font-size="14" fill="#e6edf3">pasr explain <tspan fill="#a5d6ff">"how are redirects resolved and followed"</tspan> <tspan fill="#8b949e">--budget 3000</tspan></text>
  </g>

  <!-- output -->
  <g font-size="13.5">
    <g>
      <text x="26" y="122" fill="#8b949e">receipt <tspan fill="#c9d1d9">3e78c870ff68</tspan>   route: <tspan fill="#7ee787">selected</tspan>   <tspan fill="#6e7681">selected in 0.26 s, offline</tspan></text>
    </g>

    <g>
      <text x="26" y="156" font-size="19" fill="#e6edf3">42,768 input <tspan fill="#5b6472">→</tspan> <tspan fill="#3fb950" font-weight="bold">2,718</tspan> returned tokens</text>
    </g>

    <g>
      <text x="26" y="192" fill="#8b949e">kept 10 spans — every one with <tspan fill="#c9d1d9">file:line</tspan> + why</text>
    </g>

    <g>
      <text x="40" y="218" fill="#79c0ff">src/requests/sessions.py:694-754<tspan x="330" fill="#5b6472">bm25, lexical_anchor</tspan></text>
    </g>
    <g>
      <text x="40" y="240" fill="#79c0ff">src/requests/models.py:981-995<tspan x="330" fill="#5b6472">symbol</tspan></text>
    </g>
    <g>
      <text x="40" y="262" fill="#79c0ff">src/requests/__init__.py:1-62<tspan x="330" fill="#5b6472">active_window</tspan></text>
    </g>
    <g>
      <text x="40" y="284" fill="#5b6472">…7 more</text>
    </g>

    <g>
      <text x="26" y="320" fill="#d29922">assessment  <tspan fill="#c9d1d9">localized · heuristic score 0.68</tspan></text>
    </g>
    <g>
      <text x="26" y="344" fill="#6e7681">— not a correctness probability or proof of complete evidence</text>
    </g>

    <g>
      <text x="26" y="392" font-size="14" fill="#7ee787">$ <tspan fill="#484f58">▋</tspan></text>
    </g>
  </g>

  <text x="430" y="452" text-anchor="middle" font-size="12.5" fill="#6e7681">Historical CLI selection · source tokens, not API cost or answer accuracy</text>
</svg>
