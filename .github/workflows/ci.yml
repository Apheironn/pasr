name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q
      - name: core stays torch-free (and mcp-free)
        run: |
          python -c "import sys, pasr.pipeline, pasr.schema, pasr.select, pasr.symbols, pasr.trace; bad=[m for m in ('torch','transformers','mcp') if m in sys.modules]; assert not bad, bad"
