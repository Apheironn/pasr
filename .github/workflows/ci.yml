name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests eval
      - run: ruff format --check src tests eval
      - run: pytest -q
      - name: core stays torch-free (and mcp-free)
        run: |
          python -c "import sys, pasr.pipeline, pasr.schema, pasr.select, pasr.symbols, pasr.trace; bad=[m for m in ('torch','transformers','mcp') if m in sys.modules]; assert not bad, bad"
      - name: headless context (offline smoke)
        run: |
          python -m pasr.cli context --issue "how is the hard token budget enforced" src \
            --budget 4000 --format text --context-file "$RUNNER_TEMP/ctx.txt" --metrics-file "$RUNNER_TEMP/m.json" > /dev/null
          test -s "$RUNNER_TEMP/ctx.txt"
          python -c "import json,sys; m=json.load(open(sys.argv[1])); assert {'tokens_in','tokens_out','route','round_trips_saved'} <= set(m), m; print(m)" "$RUNNER_TEMP/m.json"
